<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مقارنة الأسعار في منطقة جازان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone-first app; deep pine app bar with brass accent and a logo slot, pill tabs with icons, soft elevated cards; summary before detail. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#e6ecea; --line:#d6dedb;
  --ink:#12231f; --ink-2:#55665f;
  --accent:#00524D; --accent-ink:#ffffff; --accent-soft:#dbece8;
  --brass:#C9A45C; --brass-soft:#f6ead2;
  --bar-1:#003B37; --bar-2:#00524D;
  --good:#1b7a4a; --good-soft:#dcf1e5;
  --warn:#9a5a00; --warn-soft:#fbe6c2;
  --crit:#b3261e; --crit-soft:#f9dedb;
  --shadow:0 1px 2px rgba(10,40,35,.05),0 6px 20px rgba(10,40,35,.07);
  --display:"Tajawal","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1715; --surface:#14221f; --surface-2:#1c2d29; --line:#2a3d38;
    --ink:#e6efec; --ink-2:#9fb3ad;
    --accent:#5cc4b3; --accent-ink:#062521; --accent-soft:#153d37;
    --brass:#e0b45e; --brass-soft:#3d3015;
    --bar-1:#082b27; --bar-2:#0f4f47;
    --good:#6fd09b; --good-soft:#173b29;
    --warn:#f0b04a; --warn-soft:#45310c;
    --crit:#f2938c; --crit-soft:#4a1f1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1715; --surface:#14221f; --surface-2:#1c2d29; --line:#2a3d38;
  --ink:#e6efec; --ink-2:#9fb3ad;
  --accent:#5cc4b3; --accent-ink:#062521; --accent-soft:#153d37;
  --brass:#e0b45e; --brass-soft:#3d3015;
  --bar-1:#082b27; --bar-2:#0f4f47;
  --good:#6fd09b; --good-soft:#173b29;
  --warn:#f0b04a; --warn-soft:#45310c;
  --crit:#f2938c; --crit-soft:#4a1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 56px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:19px;font-weight:600;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.card>h2::before,.card>.row>h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brass);flex:none}
h3{font-size:15px;font-weight:600;margin:0}
p{margin:0}
.muted{color:var(--ink-2);font-size:13px}
svg.i{width:18px;height:18px;flex:none}
/* app bar */
.appbar{margin:0 -16px;padding:14px 16px 16px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,var(--bar-2) 0%,var(--bar-1) 70%);border-radius:0 0 22px 22px;box-shadow:0 8px 24px rgba(8,45,40,.25);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.appbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);pointer-events:none}
.appbar>*{position:relative;z-index:1}
.brandrow{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.55);display:grid;place-items:center;text-align:center;font-size:9.5px;line-height:1.25;color:rgba(255,255,255,.8);flex:none;background:rgba(255,255,255,.06)}
.logo.lg{width:84px;height:84px;font-size:12px;border-radius:22px}
.brandtext{flex:1;min-width:0}
.brandtext small{display:block;color:rgba(255,255,255,.72);font-size:12px}
.barbtn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;width:40px;height:40px;display:inline-grid;place-items:center;position:relative}
.barbtn:hover{background:rgba(255,255,255,.2)}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--brass);color:#1d1404;border-radius:99px;font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
.userrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brass);color:#1d1404;display:grid;place-items:center;font-weight:600;font-family:var(--display)}
.chipw{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;background:rgba(255,255,255,.14);color:#fff;border:0}
.chipw.off{background:#c0392b}
.cred{font-weight:700;font-family:monospace;font-size:15px;direction:ltr;unicode-bidi:isolate}.chipw.net{background:rgba(255,255,255,.1)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:#9bd3b4}.dot.off{background:#f0a49a}.dot.sy{background:#f2d27a}
.login label{display:flex;flex-direction:column;gap:6px;font-weight:500}.login input{font-size:18px;padding:10px 12px}
.chipw.pend{background:var(--brass);color:#1d1404}
.dotlive{width:7px;height:7px;border-radius:50%;background:#6ee7a8;box-shadow:0 0 0 3px rgba(110,231,168,.25)}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:8px 14px;border-radius:99px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px rgba(15,90,82,.28)}
/* surfaces */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
button.pill{border:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--accent)}
.kpi.crit::before{background:var(--crit)} .kpi.warn::before{background:var(--warn)} .kpi.good::before{background:var(--good)}
.kpi b{display:block;font-family:var(--display);font-size:24px;font-weight:600;line-height:1.3}
.kpi span{font-size:12px;color:var(--ink-2)}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 11px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:99px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:11px;padding:9px 16px;font-weight:500;box-shadow:0 3px 10px rgba(15,90,82,.22);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none}
.btn.danger{background:transparent;border-color:var(--crit);color:var(--crit);box-shadow:none}
.btn.sm{padding:4px 11px;font-size:13px;border-radius:9px}
.btn.big{padding:12px 18px;font-size:16px;width:100%}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.good{background:var(--good-soft);color:var(--good)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note.crit{background:var(--crit-soft);color:var(--crit)}
.list{display:flex;flex-direction:column}
.list>.item{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.list>.item:first-child{border-top:0;padding-top:0}
.list>.item:last-child{padding-bottom:0}
.scroll{max-height:320px;overflow:auto}
input[type=number],input[type=search],input[type=text],input[type=tel],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=number]{width:108px}
input[type=search]{flex:1;min-width:140px}
textarea{width:100%;min-height:54px;resize:vertical}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-2)}
.form input{width:100%}
.prod{padding:11px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.prod:first-child{border-top:0}
.prod .name{font-weight:500}
.gh{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gh h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brass)}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink-2);font-weight:500;font-size:12px;background:var(--surface-2)}
th:first-child{border-start-start-radius:8px} th:last-child{border-start-end-radius:8px}
.tw{overflow-x:auto}
/* login */
.hero{margin:0 -16px;padding:34px 20px 70px;color:#fff;text-align:center;background:radial-gradient(120% 120% at 50% 0%,var(--bar-2) 0%,var(--bar-1) 75%);border-radius:0 0 30px 30px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:12px}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:23px}
.hero p{color:rgba(255,255,255,.78);font-size:14px;max-width:36ch}
.hero .tag{background:var(--brass);color:#1d1404;border-radius:99px;padding:2px 12px;font-size:12px;font-weight:600}
.login{max-width:420px;width:100%;margin:-48px auto 0;position:relative;z-index:2}
.pin{font-size:24px;letter-spacing:8px;text-align:center;width:100%;padding:12px!important}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow)}
.feat svg{color:var(--accent);width:22px;height:22px}
.foot{text-align:center;color:var(--ink-2);font-size:12px;padding-top:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}.card,.kpi{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.fl select,.fl input{width:100%;font-size:15px;color:var(--ink)}
.ecgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ecbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.ecbtn b{font-family:var(--display);font-size:18px;color:var(--accent)}
.ecbtn small{color:var(--ink-2);font-size:11.5px}
.ecbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.card.cat{padding:0;gap:0;overflow:hidden}
.cathead{border:0;background:none;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;text-align:start;color:var(--ink)}
.cathead span:first-child{display:flex;flex-direction:column}
.cathead small{color:var(--ink-2);font-size:12px}
.chev{font-size:20px;color:var(--accent);width:22px;text-align:center}
.plist{padding:0 16px}
.prod{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.pn{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 170px}
.pv{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.up{color:var(--accent);font-size:11.5px}
.addbox,.supbox{margin:4px 16px 14px;background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.addbtn{margin:6px 16px 4px;align-self:flex-start}
.suprow{display:grid;grid-template-columns:1.5fr 1fr;gap:6px}
.suprow input{width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.filt details summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14px;padding:4px 0}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bars{display:flex;flex-direction:column;gap:5px}
.barrow{display:grid;grid-template-columns:92px 1fr 58px;align-items:center;gap:8px;font-size:13px}
.barrow.sel .bl{color:var(--accent);font-weight:600}
.bt{position:relative;height:14px;background:var(--surface-2);border-radius:4px}
.bt em{position:absolute;inset-block:0;inset-inline-start:50%;border-inline-start:1px dashed var(--ink-2)}
.bt i{position:absolute;inset-block:2px;border-radius:3px}
.bt i.up{background:#c4402e}.bt i.dn{background:#1b7a4a}
.bt i.na{position:static;font-size:11px;color:var(--ink-2);font-style:normal;padding-inline-start:6px}
.bv{text-align:end;font-variant-numeric:tabular-nums}
.bv.crit{color:var(--crit)}.bv.good{color:var(--good)}
.k3{grid-template-columns:repeat(3,1fr)}
@media (max-width:560px){.k3{grid-template-columns:1fr}}
.kpi.good b{color:var(--good)}.kpi.good::before{background:var(--good)}
.kpi b{font-size:20px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:start;text-decoration:underline;text-underline-offset:3px}
.heatw{max-height:none}
.heatt{font-size:12px;border-collapse:separate;border-spacing:2px}
.heatt th{background:none;color:var(--ink-2);font-weight:500;vertical-align:bottom;padding:2px}
.heatt th span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block;max-height:120px;overflow:hidden;text-overflow:ellipsis}
.heatt .stk{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;text-align:start;white-space:nowrap;color:var(--ink);font-weight:500}
.heatt td{min-width:34px;height:30px;padding:0;text-align:center;border-radius:4px;border:1px solid var(--line)}
.hc{border:0;background:none;width:100%;height:100%;font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{width:22px;height:12px;border-radius:3px;display:inline-block}
input[type=search]{width:100%}
.wrap{max-width:1100px}
.entry{gap:14px}
.ehead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
.ehead .wide{grid-column:span 2}
@media (max-width:760px){.ehead{grid-template-columns:1fr 1fr}.ehead .wide{grid-column:span 2}}
@media (max-width:420px){.ehead{grid-template-columns:1fr}.ehead .wide{grid-column:auto}}
.ro{background:var(--surface-2)!important;color:var(--ink-2)}
.srch{display:flex}
.srch input{flex:1;border-start-end-radius:0;border-end-end-radius:0;min-width:0}
.sbtn{border:1px solid var(--line);border-inline-start:0;background:var(--surface);border-start-end-radius:10px;border-end-end-radius:10px;padding:0 12px;color:var(--ink)}
.erow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.swt{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.swt:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.sw input:checked+.swt{background:#14a89a}
.sw input:checked+.swt:after{inset-inline-start:19px}
.sw input:focus-visible+.swt{outline:2px solid var(--brass);outline-offset:2px}
.catsel select{background:#14a89a;color:#fff;border:0;font-weight:600;padding:9px 14px;border-radius:8px;max-width:100%}
.srch2{display:flex;align-items:center;gap:8px;font-size:14px}
.srch2 input{width:200px}
.etable table{font-size:14px}
.etable th{background:none;color:var(--ink);font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap}
.sortb{border:0;background:none;font:inherit;font-weight:700;color:inherit;display:inline-flex;gap:4px;align-items:center;padding:0}
.sortb span{color:var(--ink-2);font-size:11px}
.etable td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:middle}
.etable tr:nth-child(odd) td{background:var(--surface-2)}
.etable tr.done td{background:var(--accent-soft)}
.etable .pname{min-width:200px}
.pmwrap{position:relative;width:100%;aspect-ratio:640/600;background:#eef5f7;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.pmwrap canvas,.pmwrap svg{position:absolute;inset:0;width:100%;height:100%}
.pmleg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.pmleg i{flex:1;height:12px;border-radius:6px}
.pmleg.sc{justify-content:space-between;margin-top:-6px}
.mlogo{height:52px;width:auto;flex:none}.mlogo.lg{height:96px}
.report{background:#fff;color:#12302D;border:1px solid var(--line);border-radius:14px;padding:28px;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:14px}
.report h1{font-family:"Tajawal",sans-serif;font-weight:800;color:#00524D;font-size:26px;margin:0}
.report h2{font-family:"Tajawal",sans-serif;font-weight:800;color:#00524D;font-size:18px;margin:6px 0;border-bottom:3px solid #C9A45C;padding-bottom:4px;display:block}
.report h2::before{display:none}
.report h3{font-size:14px;color:#0E3B36;margin:10px 0 4px}
.report p{margin:0 0 6px;color:#4F6461}
.report section{display:flex;flex-direction:column;gap:6px}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:4px solid #00524D;padding-bottom:10px}
.rmeta{font-size:12px;color:#4F6461;text-align:left}
.rkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rkpis div{background:#F2F5F4;border-radius:10px;padding:10px;text-align:center}
.rkpis b{display:block;font-family:"Tajawal",sans-serif;font-size:22px;color:#00524D}
.rkpis span{font-size:12px;color:#4F6461}
.report table{width:100%;border-collapse:collapse;font-size:12px}
.report th{background:#0E3B36;color:#fff;font-weight:600;padding:5px 6px;text-align:right}
.report td{padding:4px 6px;border-bottom:1px solid #E3EAE8;background:#fff;color:#12302D}
.report tr:nth-child(even) td{background:#F7F9F8}
.report table.sm{font-size:11px}
.report td.hi{color:#B3261E;font-weight:700}.report td.lo{color:#1B7A4A;font-weight:700}
.report small{color:#4F6461}
.report .note2{font-size:11px}
.report .heatr{font-size:10px;table-layout:fixed}
.report .heatr th{background:#fff;color:#4F6461;font-weight:500;vertical-align:bottom;padding:2px}
.report .heatr th span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block;max-height:110px}
.report .heatr tr th:first-child{width:72px;text-align:right}
.report .heatr td{text-align:center;padding:3px 0;border:1px solid #fff;font-weight:600}
.rfoot{position:absolute;bottom:16px;left:40px;right:40px;text-align:center;font-size:10px;color:#4F6461;border-top:1px solid #E3EAE8;padding-top:6px}
.rpage{position:relative;border:0;border-radius:0}
@media print{body{background:#fff}.appbar,.tabs,.noprint,.note,nav{display:none!important}.wrap{max-width:none;padding:0}.report{border:0;padding:0}.report tr{break-inside:avoid}.report h2,.report h3{break-after:avoid}}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.pcell{min-width:96px}
.pcell input{width:90px;border:0;border-bottom:1.5px dashed var(--ink-2);border-radius:0;background:transparent;padding:4px 2px;text-align:start}
.pcell input:focus{border-bottom-color:var(--accent);box-shadow:none}
.pcell .up{display:block}

function basePrice(p,r){

  let v;
  if(/الدقيق/.test(cn)) v=/خبز/.test(n)?1:kg*(n.includes("بر")?3.6:3.2);
  else if(/الارز/.test(cn)) v=kg*({"ابو كاس":9.6,"الشعلان":9.2,"الوليمة":8.7,"العائلة":8.1,"انديا جيت":10.4,"تيلدا":11.5,"ملك الارز":8.4,"ابو بنت":9}[p.b]||9);
  else if(/سكر/.test(cn)) v=kg*4.1;
  else if(/الزيوت/.test(cn)) v=L*({"عافية":10.5,"العربي":9.6,"نور":9.4}[p.b]||9);
  else if(/الشاي/.test(cn)) v=q&&q[1]==="حبة"?q[0]*0.17:kg*58;
  else if(/معلبات/.test(cn)) v=/قشطة/.test(n)?kg*36:kg*13;
  else if(/الاجبان/.test(cn)) v=/مثلثات/.test(n)?kg*68:kg*37;
  else if(/حليب بودرة/.test(cn)) v=kg*({"نيدو":47,"أبو قوس":44,"انكور":45}[p.b]||41);
  else if(/أطفال/.test(cn)) v=/سيريلاك/.test(n)?kg*48:kg*110;
  else if(/طازجة/.test(cn)) v=/زبادي/.test(n)?kg*6.5:L*6.6;
  else if(/الدجاج الطازج/.test(cn)) v=kg*19;
  else if(/الدجاج المجمد/.test(cn)) v=kg*14.5;
  else if(/البيض/.test(cn)) v=p.l==="كبير"?19:16;
  else if(/اللحوم/.test(cn)) v=({"خروف":72,"تيس":68,"عجل":52,"حاشي":57}[(n.match(/خروف|تيس|عجل|حاشي/)||["خروف"])[0]])*kg;
  else if(/الفواكه/.test(cn)) v=kg*(5+((n.length*7)%5));
  else if(/خضار/.test(cn)) v=kg*(3+((n.length*5)%6));
  else if(/الشعير/.test(cn)) v=58;
  else if(/الأسمنت/.test(cn)) v=/أبيض/.test(n)?36:/جبس/.test(n)?15:17;
  else if(/الحديد/.test(cn)){const d=+(p.l.match(/\d+/)||[12])[0];v=d*d*0.29;}
  else v=10;
  return v*(0.97+r()*0.06);
}

  if(SB.sess&&SB.sess.user){loadCache();const m=S.users.find(x=>x.uid===SB.sess.user.id&&x.active);if(m){UI.uid=m.id;UI.tab=TABS[m.role][0][0];}render();await pullAll();if(UI.uid){if(!UI.tab)UI.tab=TABS[me().role][0][0];syncPush();render();}}
  else render();
  setInterval(()=>{if(UI.uid&&document.visibilityState!=="hidden"){pullAll().then(syncPush);}},60000);
  window.addEventListener("online",()=>{NET.on=true;if(UI.uid){syncPush();pullAll();}});
  window.addEventListener("offline",()=>{NET.on=false;netPaint();});

}
function genPass(){const A="abcdefghjkmnpqrstuvwxyz23456789";let s="";const r=new Uint32Array(8);try{crypto.getRandomValues(r);}catch(e){for(let i=0;i<8;i++)r[i]=Math.floor(Math.random()*1e9);}for(let i=0;i<8;i++)s+=A[r[i]%A.length];return s;}

function readings(opt){
  opt=opt||{};const f=UI.f, out=[];
  S.visits.forEach(v=>{if(!v.done)return;if(!opt.allEc&&f.ec!=="all"&&v.est.ec!==f.ec)return;if(!opt.allGov&&f.govs.length&&!f.govs.includes(v.gov))return;
    Object.keys(v.entries).forEach(k=>{const p=PBY[k];if(!p||p.st==="rejected")return;const e=v.entries[k];if(!(e.p>0))return;
      out.push({pid:+k,p:e.p,gov:v.gov,ec:v.est.ec,est:v.est.name,emp:v.emp,t:v.t,vid:v.id,c:p.c});});});
  return out;}
function byProduct(rs){const m={};rs.forEach(x=>{(m[x.pid]=m[x.pid]||[]).push(x);});return m;}
const estCount=a=>new Set(a.map(x=>x.est)).size;
function relMap(rs){const bp=byProduct(rs), mean={};Object.keys(bp).forEach(k=>{if(estCount(bp[k])>1)mean[k]=avg(bp[k].map(x=>x.p));});
  return rs.filter(x=>mean[x.pid]).map(x=>Object.assign({rel:x.p/mean[x.pid]-1},x));}
function uniques(){const bp=byProduct(readings({allEc:true,allGov:true}));return Object.keys(bp).filter(k=>estCount(bp[k])===1).map(k=>({p:PBY[k],r:bp[k][bp[k].length-1]}));}
function heatColor(d){if(d==null)return "transparent";const a=Math.min(1,Math.abs(d)/0.12);return d>0?`rgba(196,64,46,${0.12+a*0.6})`:`rgba(27,122,74,${0.12+a*0.55})`;}

  if(drafts.length)h+='<div class="card"><h2>زيارات غير مكتملة</h2><div class="list">'+drafts.map(v=>'<div class="item"><div class="row between"><b>'+esc(v.est.name||"منشأة بلا اسم")+'</b><button class="btn ghost sm" data-act="resume" data-id="'+v.id+'">متابعة</button></div><span class="muted">'+esc(v.gov||"")+' · '+Object.keys(v.entries).length+' سعراً</span></div>').join("")+'</div></div>';
  h+='<div class="card"><h2>زياراتي المرسلة</h2>'+(done.length?'<div class="list">'+done.slice(0,15).map(v=>'<div class="item"><div class="row between"><b>'+esc(v.est.name)+'</b><span class="muted">'+fmt(v.t)+'</span></div><div class="row"><span class="pill">'+esc(v.gov)+'</span><span class="pill acc">فئة '+v.est.ec+'</span><span class="pill good">'+Object.keys(v.entries).length+' سعراً</span></div></div>').join("")+'</div>':'<p class="muted">لا توجد زيارات بعد.</p>')+'</div>';
  return h;
}
const curVisit=()=>S.visits.find(v=>v.id===UI.visit);
function pcode(p){if(p.st==="ok"&&p.id<=BASEN){const ps=S.products.filter(x=>x.c===p.c&&x.id<=BASEN);return "JZ"+String(p.c+1).padStart(2,"0")+String(ps.indexOf(p)+1).padStart(2,"0");}return "NEW"+String(p.id).slice(-5);}
const shortCat=c=>CATS[c].name.replace(/\s*\(.*\)/,"").replace(/^ال/,"");
function visitView(){
  const v=curVisit(), auto=S.autosave!==false, cat=UI.vcat, q=norm(UI.q);
  let ps=S.products.filter(p=>p.st==="ok"||p.st==="pending").filter(p=>cat==="all"||p.c===+cat).filter(p=>!q||norm(p.n+" "+p.b+" "+pcode(p)).includes(q));

    '<label class="fl wide" for="vn">اسم المنشأة<input id="vn" type="text" data-in="vf" data-f="name" value="'+esc(v.est.name||"")+'"'+(v.est.found?' readonly class="ro"':'')+'></label>'+
    '<label class="fl" for="vg">المحافظة<select id="vg" data-ch="vg"><option value="">اختر</option>'+GOVS.map(g=>'<option'+(v.gov===g?" selected":"")+'>'+g+'</option>').join("")+'</select></label>'+
    '<label class="fl" for="ve">فئة المنشأة<select id="ve" data-ch="ve"><option value="">اختر</option>'+ECAT.map(e=>'<option value="'+e[0]+'"'+(v.est.ec===e[0]?" selected":"")+'>'+e[0]+'. '+e[1]+(e[2]?' ('+e[2]+')':'')+'</option>').join("")+'</select></label>'+
    '</div><p class="muted">الموقع: '+(v.loc&&v.loc.src==="gps"?'سُجّل من GPS الجهاز (±'+(v.loc.acc||"?")+' م).':'لم يُلتقط من الجهاز بعد، وسيُستخدم مركز المحافظة عند الحفظ.')+'</p>'+(UI.emsg?'<div class="note '+UI.emsg.k+'">'+esc(UI.emsg.t)+'</div>':'')+
    '<div class="erow"><div class="row"><label class="sw"><input type="checkbox" data-ch="auto"'+(auto?" checked":"")+'><span class="swt" aria-hidden="true"></span>حفظ آلي</label><button class="btn" data-act="vsave">حفظ</button><button class="btn ghost" data-act="back">رجوع</button></div></div>'+
    '<div class="erow"><label class="catsel"><span class="sr">الصنف</span><select data-ch="vcat" aria-label="الصنف"><option value="all"'+(cat==="all"?" selected":"")+'>كل الأصناف</option>'+CATS.map(c=>{const n=S.products.filter(p=>p.c===c.id&&(p.st==="ok"||p.st==="pending")).length,e=S.products.filter(p=>p.c===c.id&&v.entries[p.id]).length;return '<option value="'+c.id+'"'+(String(cat)===String(c.id)?" selected":"")+'>'+esc(c.name)+' ('+n+')'+(e?' · مُدخل '+e:'')+'</option>';}).join("")+'</select></label>'+
    '<label class="srch2" for="q">بحث<input id="q" type="search" data-in="q" value="'+esc(UI.q)+'"></label></div>'+

    ps.map(p=>prow(v,p)).join("")+'</tbody></table></div>'+
    '<div class="row between"><span class="muted">عدد الأصناف '+ps.length+' من '+(cat==="all"?total:catCount)+'</span><span class="muted">المُدخل في الزيارة: <b id="vcount">'+entered+'</b></span></div></div>';
  if(cat!=="all"){
    const c=+cat, np=UI.np[c];
    h+='<div class="card"><h2>'+esc(CATS[c].name)+': إضافات</h2>'+(np?'<div class="addbox" style="margin:0"><b>منتج غير مسجل</b><div class="form"><label for="npn-'+c+'">اسم المنتج<input id="npn-'+c+'" type="text" data-in="np" data-c="'+c+'" data-f="n" value="'+esc(np.n||"")+'"></label><label for="npb-'+c+'">العلامة التجارية<input id="npb-'+c+'" type="text" data-in="np" data-c="'+c+'" data-f="b" value="'+esc(np.b||"")+'"></label>'+
      '<label for="nps-'+c+'">الكمية<input id="nps-'+c+'" type="number" inputmode="decimal" min="0" step="any" data-in="np" data-c="'+c+'" data-f="s" value="'+esc(np.s||"")+'"></label><label for="npu-'+c+'">الوحدة<select id="npu-'+c+'" data-ch="npu" data-c="'+c+'">'+UNITS.map(u=>'<option'+(np.u===u?" selected":"")+'>'+u+'</option>').join("")+'</select></label>'+
      '<label for="npp-'+c+'">السعر<input id="npp-'+c+'" type="number" inputmode="decimal" min="0" step="any" data-in="np" data-c="'+c+'" data-f="p" value="'+esc(np.p||"")+'"></label></div>'+(np.err?'<div class="note warn">'+esc(np.err)+'</div>':'')+
      '<div class="row"><button class="btn sm" data-act="npsave" data-c="'+c+'">حفظ المنتج وسعره</button><button class="btn ghost sm" data-act="npcancel" data-c="'+c+'">إلغاء</button></div><p class="muted">يُحفظ بانتظار اعتماد المشرف.</p></div>':'<button class="btn ghost sm" style="align-self:flex-start" data-act="npopen" data-c="'+c+'">+ إضافة منتج غير مسجل</button>');

  } else h+='<p class="muted">اختر صنفاً من القائمة لإضافة منتج غير مسجل أو تسجيل موردي الصنف.</p>';

function repData(){
  const inR=v=>v.done&&(!UI.rf||v.date>=UI.rf)&&(!UI.rt||v.date<=UI.rt);
  const vs=S.visits.filter(inR), rs=[];
  vs.forEach(v=>Object.keys(v.entries).forEach(k=>{const p=PBY[k];if(!p||p.st==="rejected")return;rs.push({pid:+k,p:v.entries[k].p,gov:v.gov,ec:v.est.ec,est:v.est.name,emp:v.emp,t:v.t,vid:v.id,c:p.c});}));
  return {vs:vs,rs:rs};
}

function drawPriceMap(){
  const cv=document.getElementById("pmap");if(!cv)return;const D=pmapData();if(!D.length)return;
  const mx=Math.max(0.05,...D.map(x=>Math.abs(x.d))), ctx=cv.getContext("2d"), W=PM.W, H=PM.H, step=4;
  const pts=D.map(x=>({x:pmX(x.ll[1]),y:pmY(x.ll[0]),t:0.5+x.d/(2*mx)})), all=Object.values(GC).map(c=>({x:pmX(c[1]),y:pmY(c[0])}));
  const img=ctx.createImageData(W,H), px=img.data;
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){
    let ws=0,vs=0,near=0;
    for(const p of pts){const d2=(p.x-x)**2+(p.y-y)**2+1;const w=1/(d2*d2);ws+=w;vs+=w*p.t;}
    for(const p of all){const d=Math.sqrt((p.x-x)**2+(p.y-y)**2);near=Math.max(near,Math.exp(-((d/70)**2)));}
    const a=Math.min(0.85,near*1.25);if(a<0.02)continue;
    const col=rampColor(vs/ws);
    for(let yy=y;yy<Math.min(H,y+step);yy++)for(let xx=x;xx<Math.min(W,x+step);xx++){const i=(yy*W+xx)*4;px[i]=col[0];px[i+1]=col[1];px[i+2]=col[2];px[i+3]=a*255;}
  }
  ctx.putImageData(img,0,0);
}

    return {"المراقب":e.name,"الزيارات":vs.length,"المنشآت":new Set(vs.map(v=>v.est.uni||v.est.name)).size,"المحافظات المغطاة":new Set(vs.map(v=>v.gov)).size,"المحافظات":[...new Set(vs.map(v=>v.gov))].join("، "),"الأسعار المدخلة":n,"المنتجات الجديدة المضافة":np,"الموردون المسجلون":sp,"أول زيارة":vs.length?ymd(Math.min(...vs.map(v=>v.t))):"","آخر زيارة":vs.length?ymd(Math.max(...vs.map(v=>v.t))):""};});

  emps.forEach(e=>{const rows=[];S.visits.filter(v=>v.emp===e.id&&inRange(v)).sort((a,b)=>a.t-b.t).forEach(v=>Object.keys(v.entries).forEach(k=>{const p=PBY[k];if(!p)return;const u=unitPrice(p,v.entries[k].p);
    rows.push({"التاريخ":v.date,"الوقت":fmt(v.t,{hour:"2-digit",minute:"2-digit"}),"المحافظة":v.gov,"رقم السجل الموحد":v.est.uni||"","رقم السجل التجاري":v.est.cr||"","اسم المنشأة":v.est.name,"فئة المنشأة":v.est.ec+" "+ECN[v.est.ec],"الصنف":CATS[p.c].name,"رمز الصنف":pcode(p),"اسم المنتج":p.n,"العلامة التجارية":p.b,"الكمية":p.s==null?p.l:p.s,"الوحدة":p.u||"","السعر":v.entries[k].p,"سعر الوحدة":u?r2(u[0]):"","وحدة المقارنة":u?u[1]:"","حالة المنتج":p.st==="pending"?"جديد بانتظار الاعتماد":p.st==="rejected"?"مرفوض":"معتمد","موردو الصنف":((v.sup||{})[p.c]||[]).filter(x=>x.n).map(x=>x.n+(x.r?" ("+x.r+")":"")).join("، "),"خط العرض":(locOf(v)||{}).lat||"","خط الطول":(locOf(v)||{}).lng||"","مصدر الموقع":locSrc(locOf(v)),"رابط الموقع":locOf(v)?mapLink(locOf(v)):""});}));
    add(rows,e.name,["اسم المنشأة","اسم المنتج","موردو الصنف","الصنف"]);});
  const nm=(UI.xe==="all"?"عمل-المراقبين":"عمل-"+uname(+UI.xe).replace(/\s+/g,"-"))+(UI.xf||UI.xt?"-"+(UI.xf||"البداية")+"-إلى-"+(UI.xt||TODAY):"-"+TODAY)+".xlsx";
  if(await saveFile(nm,XLSX.write(wb,{type:"array",bookType:"xlsx"}))){log("سحب ملف عمل "+(UI.xe==="all"?"كل المراقبين":uname(+UI.xe)));save();}
}

/* ---------- العرض والأحداث ---------- */
const IC={key:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>',logout:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>'};
function digits(x,keepDot){return String(x||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g,".").replace(keepDot?/[^\d.]/g:/\D/g,"");}
function grabLoc(v){try{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{v.loc={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),src:"gps",t:Date.now()};save();if(UI.visit===v.id)render();},()=>{},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});}catch(e){}}
function locOf(v){if(v.loc&&v.loc.lat)return v.loc;const c=GC[v.gov];return c?{lat:c[0],lng:c[1],src:"approx"}:null;}
const locSrc=l=>!l?"—":l.src==="gps"?"GPS"+(l.acc?" (±"+l.acc+" م)":""):l.src==="demo"?"تجريبي":"تقريبي (مركز المحافظة)";
const mapLink=l=>"https://www.google.com/maps?q="+l.lat+","+l.lng;
function autoSave(){if(S.autosave!==false)save();}
function render(){setTimeout(drawPriceMap,0);document.getElementById("app").innerHTML=UI.uid&&me()?shell():loginView();}
function refreshRow(pid){const v=curVisit();if(!v)return;const el=document.getElementById("row-"+pid);if(el&&el.parentNode){try{el.outerHTML=prow(v,PBY[pid]);}catch(e){}}const c=document.getElementById("vcount");if(c)c.textContent=Object.keys(v.entries).length;}
document.addEventListener("submit",ev=>{ev.preventDefault();if(ev.target.id==="login")login(document.getElementById("lu").value,document.getElementById("lp").value);if(ev.target.id==="pwform")changePass();});
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,d=b.dataset,u=me();
  if(!["delv","delu","uact","reset","logout"].includes(a))UI.del=null;if(a!=="sync")UI.msg=null;if(a!=="tab"&&a!=="upass")UI.cred=null;
  switch(a){
    case "logout":{const n=pendingCount();if(n&&UI.del!=="logout"){UI.del="logout";UI.msg={k:"warn",t:"لديك "+n+" تغيير لم يُرسل بعد (لا يوجد اتصال). إن خرجت الآن يبقى محفوظاً على هذا الجهاز ويُرسل عند دخولك منه مجدداً. اضغط زر الخروج مرة أخرى للتأكيد."};break;}logout();return;}
    case "sync":pullAll().then(syncPush);return;
    case "upass":userPass(+d.id);return;
    case "uact":UI.del="u"+d.id;break;
    case "uact2":userActive(+d.id);return;
    case "tab":UI.tab=d.v;UI.visit=null;window.scrollTo(0,0);break;
    case "newvisit":{const last=S.visits.filter(v=>v.emp===u.id).sort((x,y)=>y.t-x.t)[0];const v={id:nid(),emp:u.id,gov:last?last.gov:"",est:{uni:"",cr:"",name:"",ec:""},t:Date.now(),date:TODAY,done:false,entries:{},sup:{}};S.visits.push(v);grabLoc(v);UI.visit=v.id;UI.q="";UI.vcat="all";UI.sort={k:null,d:1};UI.emsg=null;save();break;}
    case "findest":{const v=curVisit(),uni=digits(document.getElementById("vu").value),e=S.ests[uni];v.est.uni=uni;
      if(e){v.est={uni:uni,cr:e.cr,name:e.name,ec:e.ec,found:true};v.gov=e.gov;UI.emsg={k:"good",t:"وُجدت المنشأة وعُبئت بياناتها."};}
      else{v.est.found=false;UI.emsg={k:"info",t:uni?"منشأة غير مسجلة. أكمل رقم السجل التجاري والاسم والمحافظة والفئة، وتُحفظ للزيارات القادمة.":"اكتب رقم السجل الموحد ثم اضغط بحث."};}save();break;}
    case "sort":UI.sort=UI.sort.k===d.v?{k:d.v,d:-UI.sort.d}:{k:d.v,d:1};break;
    case "vsave":{const v=curVisit();v.est.uni=digits(v.est.uni);v.est.cr=digits(v.est.cr);
      if(!v.est.uni||!v.est.name||!v.gov||!v.est.ec){UI.emsg={k:"warn",t:"أكمل رقم السجل الموحد واسم المنشأة والمحافظة وفئة المنشأة قبل الحفظ."};window.scrollTo(0,0);break;}
      if(!Object.keys(v.entries).length){UI.emsg={k:"warn",t:"لم يُدخل أي سعر بعد."};break;}
      S.ests[v.est.uni]={uni:v.est.uni,cr:v.est.cr,name:v.est.name,gov:v.gov,ec:v.est.ec};
      if(!v.loc||!v.loc.lat)v.loc=locOf(v);
      v.done=true;v.t=Date.now();v.date=TODAY;
      Object.keys(v.sup).forEach(c=>{v.sup[c]=(v.sup[c]||[]).filter(x=>x&&(x.n||x.r));v.sup[c].forEach(x=>{if(x.n&&!S.supNames.some(y=>norm(y)===norm(x.n)))S.supNames.push(x.n);});});
      log("حفظ زيارة "+v.est.name+" ("+v.gov+")");UI.visit=null;UI.emsg=null;UI.msg={k:"good",t:"حُفظت الزيارة وأُرسلت ("+Object.keys(v.entries).length+" سعراً)."};save(true);break;}
    case "resume":UI.visit=+d.id;break;
    case "back":UI.visit=null;UI.fin=false;break;
    case "step1":curVisit().step=1;break;
    case "ec":curVisit().est.ec=d.v;save();break;
    case "step2":{const v=curVisit();v.est.name=(document.getElementById("vn").value||"").trim();if(!v.gov||!v.est.name||!v.est.ec){UI.msg={k:"warn",t:"اختر المحافظة واكتب اسم المنشأة واختر فئتها."};break;}v.step=2;S.ests[v.est.name]={name:v.est.name,gov:v.gov,ec:v.est.ec};save();window.scrollTo(0,0);break;}
    case "cat":UI.open=UI.open===+d.c?null:+d.c;break;
    case "npopen":UI.np[d.c]={u:"كجم"};break;
    case "npcancel":delete UI.np[d.c];break;
    case "npsave":{const c=+d.c,np=UI.np[c],nm=(np.n||"").trim(),pr=parseFloat(np.p),sz=parseFloat(np.s);
      if(!nm||!(pr>0)){np.err="اكتب اسم المنتج وسعره على الأقل.";break;}
      const dup=S.products.find(p=>p.c===c&&p.st!=="rejected"&&norm(p.n)===norm(nm)&&(p.s===(sz>0?sz:null)));
      const v=curVisit();let id;
      if(dup){id=dup.id;}else{id=nid();S.products.push({id:id,c:c,n:nm,b:(np.b||"").trim(),s:sz>0?sz:null,u:np.u==="أخرى"?null:np.u,l:"",st:"pending",by:u.id,t:Date.now()});PBY[id]=S.products[S.products.length-1];log("أضاف منتجاً جديداً: "+nm);}
      v.entries[id]={p:pr};delete UI.np[c];UI.msg={k:"good",t:dup?"المنتج مسجل مسبقاً، وأُضيف سعره.":"أُضيف المنتج بانتظار اعتماد المشرف، وحُفظ سعره."};save();break;}
    case "askfin":UI.fin=true;break;
    case "nofin":UI.fin=false;break;
    case "finish":{const v=curVisit();v.done=true;v.t=Date.now();v.date=TODAY;delete v.step;
      Object.keys(v.sup).forEach(c=>{v.sup[c]=(v.sup[c]||[]).filter(s=>s&&(s.n||s.r));v.sup[c].forEach(s=>{if(s.n&&!S.supNames.some(x=>norm(x)===norm(s.n)))S.supNames.push(s.n);});});
      log("أرسل زيارة "+v.est.name+" ("+v.gov+")");UI.visit=null;UI.fin=false;UI.msg={k:"good",t:"أُرسلت الزيارة."};save(true);break;}
    case "fec":UI.f.ec=d.v;break;
    case "fgov":{const i=UI.f.govs.indexOf(d.v);if(i>=0)UI.f.govs.splice(i,1);else UI.f.govs.push(d.v);break;}
    case "fclear":UI.f={ec:"all",govs:[]};break;
    case "cmode":UI.cmpMode=d.v;break;
    case "goprod":{const p=PBY[d.p];UI.tab="cmp";UI.cmpMode="p";UI.cmpCat=p.c;UI.cmpPid=p.id;UI.cmpQ="";window.scrollTo(0,0);break;}
    case "gocat":UI.tab="cmp";UI.cmpMode="c";UI.cmpCat=+d.c;window.scrollTo(0,0);break;
    case "papprove":{const p=PBY[d.p];p.st="ok";log("اعتمد المنتج "+p.n);UI.msg={k:"good",t:"اعتُمد "+p.n+"."};save();break;}
    case "preject":{const p=PBY[d.p];p.st="rejected";log("رفض المنتج "+p.n);save();break;}
    case "pmerge":{const p=PBY[d.p],to=+document.getElementById("mg-"+p.id).value;if(!to){UI.msg={k:"warn",t:"اختر المنتج المسجل الذي تريد الدمج معه."};break;}
      S.visits.forEach(v=>{if(v.entries[p.id]){if(!v.entries[to])v.entries[to]=v.entries[p.id];delete v.entries[p.id];}});p.st="rejected";p.mergedTo=to;log("دمج "+p.n+" مع "+PBY[to].n);UI.msg={k:"good",t:"دُمج "+p.n+" مع "+PBY[to].n+"، وانتقلت أسعاره إليه."};save();break;}
    case "vopen":UI.vopen=UI.vopen===+d.id?null:+d.id;break;
    case "delv":UI.del=+d.id;break;
    case "delv2":{const v=S.visits.find(x=>x.id===+d.id);S.visits=S.visits.filter(x=>x!==v);log("حذف زيارة "+v.est.name);save();break;}
    case "xlsx":exportXlsx();return;
    case "xemp":exportEmp();return;
    case "rpdf":exportPDF();return;
    case "rprint":try{window.print();}catch(e){UI.msg={k:"warn",t:"الطباعة غير متاحة هنا. استخدم زر تنزيل PDF."};render();}return;
    case "msel":UI.msel=UI.msel===+d.id?null:+d.id;break;
    case "addu":addUser();return;
    default:return;
  }
  render();
});
document.addEventListener("change",ev=>{
  const t=ev.target,c=t.dataset.ch;if(!c)return;
  if(c==="price"){const v=curVisit(),pid=+t.dataset.p,val=parseFloat(digits(t.value,true));if(val>0)v.entries[pid]={p:val};else delete v.entries[pid];autoSave();refreshRow(pid);return;}
  if(c==="vg"){curVisit().gov=t.value;autoSave();return;}
  if(c==="ve"){curVisit().est.ec=t.value;autoSave();return;}
  if(c==="auto"){S.autosave=t.checked;save(true);return;}
  if(c==="vcat"){UI.vcat=t.value;UI.q="";}
  if(c==="vn"){const v=curVisit(),e=S.ests[t.value.trim()];v.est.name=t.value.trim();if(e){v.gov=e.gov;v.est.ec=e.ec;render();}save();return;}
  if(c==="npu"){UI.np[t.dataset.c].u=t.value;return;}
  if(c==="ccat"){UI.cmpCat=+t.value;UI.cmpPid=null;UI.cmpQ="";}
  else if(c==="cpid")UI.cmpPid=+t.value;
  else if(c==="scat")UI.supCat=t.value;
  else if(c==="vday")UI.vday=t.value;
  else if(c==="xe")UI.xe=t.value;
  else if(c==="re")UI.re=t.value;
  else if(c==="pmc")UI.pmc=t.value;
  else if(c==="rf")UI.rf=t.value;
  else if(c==="rt")UI.rt=t.value;
  else if(c==="me"){UI.me=t.value;UI.msel=null;}
  else if(c==="md"){UI.md=t.value;UI.msel=null;}
  else if(c==="xf")UI.xf=t.value;
  else if(c==="xt")UI.xt=t.value;
  render();
});
document.addEventListener("input",ev=>{
  const t=ev.target,k=t.dataset.in;if(!k)return;
  if(k==="np"){UI.np[t.dataset.c][t.dataset.f]=t.value;return;}
  if(k==="vf"){curVisit().est[t.dataset.f]=t.value;autoSave();return;}
  if(k==="sup"){const v=curVisit(),c=t.dataset.c,i=+t.dataset.i;v.sup[c]=v.sup[c]||[{},{},{}];while(v.sup[c].length<3)v.sup[c].push({});v.sup[c][i][t.dataset.f]=t.value;save();return;}
  if(k==="q"||k==="cq"){UI[k==="q"?"q":"cmpQ"]=t.value;render();const el=document.getElementById(k);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}
});
async function addUser(){const n=document.getElementById("nu-n").value.trim(),r=document.getElementById("nu-r").value;if(!n){UI.msg={k:"warn",t:"اكتب الاسم."};render();return;}
  const p=genPass();try{const x=await sbRpc("cmp_add_user",{p_name:n,p_role:r,p_pass:p});UI.cred={name:n,login:x.login,pass:p};log("أضاف "+ROLE[r]+" "+n);await pullAll();syncPush();}catch(e){UI.msg={k:"crit",t:"تعذرت الإضافة: "+e.message};}render();}
async function userPass(id){const u=S.users.find(x=>x.id===id);const p=genPass();try{await sbRpc("cmp_set_password",{p_id:id,p_pass:p});UI.cred={name:u.name,login:u.login,pass:p};log("أصدر كلمة مرور جديدة لـ "+u.name);save();}catch(e){UI.msg={k:"crit",t:"تعذر التغيير: "+e.message};}render();}
async function userActive(id){const u=S.users.find(x=>x.id===id);try{await sbRpc("cmp_set_active",{p_id:id,p_active:!u.active});log((u.active?"أوقف ":"فعّل ")+u.name);UI.del=null;await pullAll();syncPush();}catch(e){UI.msg={k:"crit",t:"تعذر التنفيذ: "+e.message};}render();}
async function changePass(){const a=toLatin(document.getElementById("p1").value),b=toLatin(document.getElementById("p2").value);
  if(a.length<6){UI.msg={k:"warn",t:"كلمة المرور 6 أحرف على الأقل."};render();return;}if(a!==b){UI.msg={k:"warn",t:"كلمتا المرور غير متطابقتين."};render();return;}
  try{await sbRpc("cmp_set_password",{p_id:UI.uid,p_pass:a});UI.msg={k:"good",t:"تم تغيير كلمة المرور."};log("غيّر كلمة المرور");save();}catch(e){UI.msg={k:"crit",t:"تعذر التغيير: "+e.message};}render();}
boot();
